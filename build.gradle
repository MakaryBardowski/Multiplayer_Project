plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'com.mygame'
version '0.0.93'

mainClassName = "com.mccurry.game.Main"
//mainClassName = "dirty.client.Main"

repositories {
    mavenCentral()
    jcenter()
    maven { url 'https://jitpack.io' }
}

project.ext {
    jmeVer = '3.6.0-stable'
}

project(":assets") {
    apply plugin: "java"

    buildDir = rootProject.file("build/assets")

    sourceSets {
        main {
            resources {
                srcDir '.'
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

dependencies {

    implementation 'com.epagagames:particlemonkey'
    implementation 'org.mccurry:game-lib-map'
    implementation 'org.mccurry:game-lib-serde'
    implementation 'com.mccurry:game-lib-events'
    implementation 'org.example:McCurryRandom'

    implementation("org.jetbrains:annotations:26.0.2-1")
    implementation 'org.lz4:lz4-java:1.8.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation "org.jmonkeyengine:jme3-core:$jmeVer"
    implementation "org.jmonkeyengine:jme3-desktop:$jmeVer"
    implementation "org.jmonkeyengine:jme3-lwjgl3:$jmeVer"
    implementation "org.jmonkeyengine:jme3-jogg:$jmeVer"
    implementation "org.jmonkeyengine:jme3-plugins:$jmeVer"
    implementation "org.jmonkeyengine:jme3-niftygui:$jmeVer"
    implementation "org.jmonkeyengine:jme3-networking:$jmeVer"
    implementation "org.jmonkeyengine:jme3-effects:$jmeVer"
    implementation "com.github.stephengold:Heart:8.6.0"

    implementation "com.simsilica:lemur:1.16.0"
    implementation("com.simsilica:lemur-proto:1.13.0")
    implementation("com.google.guava:guava:33.4.8-jre")

    implementation 'org.codehaus.groovy:groovy-all:3.0.21'
    compileOnly 'org.projectlombok:lombok:1.18.28'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    runtimeOnly project(':assets')

    testImplementation("org.assertj:assertj-core:3.6.1")
}

test {
    useJUnitPlatform()
}

tasks.named('distZip') {
    dependsOn shadowJar
}

tasks.named('distTar') {
    dependsOn shadowJar
}

tasks.named('shadowDistZip') {
    dependsOn shadowJar

    doFirst {
        def mapsDir = file("$buildDir/assets/resources/main/Maps")
        if (!mapsDir.exists()) {
            throw new GradleException("❌ Maps dir does not exist: $mapsDir")
        }
        println "✅ Including maps from: $mapsDir"

        def localeDir = file("$buildDir/locale")
        if (!localeDir.exists()) {
            throw new GradleException("❌ locale dir does not exist: $localeDir")
        }
        println "✅ Including locale from: $localeDir"
    }

    def archiveName = archiveFileName.get()
    def baseName = archiveName.endsWith('.zip') ? archiveName.substring(0, archiveName.lastIndexOf('.zip')) : archiveName
    println "✅ ZIP being built (without extension): ${baseName}"

    from("$buildDir/assets/resources/main/Maps") {
        into "$baseName/bin/Maps"
        include "**/*"
    }

    from("$buildDir/locale") {
        into "$baseName/bin/locale"
        include "**/*"
    }
}


tasks.named('startScripts') {
    dependsOn shadowJar
}

tasks.named('startShadowScripts') {
    dependsOn jar
}

jar {
    manifest {
        attributes 'Main-Class': "$mainClassName"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

wrapper {
    gradleVersion = '8.11'
}

shadowJar {
    archiveClassifier.set('')
    manifest {
        attributes 'Main-Class': "$mainClassName"
    }
}

application {
    mainClass.set(mainClassName)
}

//tasks.shadowDistZip.archiveClassifier='fat'

tasks.shadowDistTar.enabled = false
tasks.distTar.enabled = false
tasks.distZip.enabled = false